    - mkdir -p /home/jattamkommerce/hotel-management/tmp /home/jattamkommerce/hotel-management/backend/tmp
    - touch /home/jattamkommerce/hotel-management/tmp/restart.txt /home/jattamkommerce/hotel-management/backend/tmp/restart.txt